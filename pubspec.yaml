name: dart_server
description: A NestJS-style backend framework for Dart with modules, dependency injection, guards and an Express-like core. Zero external dependencies.
version: 1.0.3

repository: https://github.com/thejesbin/dart_server
issue_tracker: https://github.com/thejesbin/dart_server/issues

# Surfaced on pub.dev for discoverability (max 5, lowercase, hyphenated).
topics:
  - server
  - http
  - framework
  - rest
  - middleware

environment:
  sdk: ^3.0.0

# The `dart_server` CLI (project scaffolding + code generators + dev/prod
# runner). Installable with `dart pub global activate dart_server`.
executables:
  dart_server:

# No runtime dependencies — built entirely on dart:io and dart:convert.
dependencies:

dev_dependencies:
  lints: ^6.0.0
  test: ^1.24.0
